<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La carta de La Alacena</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 760px; padding: 2rem 1rem; color: #29251f; background: #faf8f4; }
    h1 { margin-bottom: .25rem; }
    #estado { color: #665f55; }
    section { margin-top: 2rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 1rem; padding: .8rem 0; border-bottom: 1px solid #ded8cd; }
    li.no-disponible { opacity: .45; }
    .precio { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .error { color: #a12222; }
  </style>
</head>
<body>
  <h1>La carta de La Alacena</h1>
  <p id="estado" role="status">Cargando la carta…</p>
  <main id="carta"></main>
  <script>
    const api = "http://localhost/api_carta/api/platos";
    const categorias = ["entrante", "principal", "postre"];
    const nombres = {
      entrante: "Entrantes",
      principal: "Platos principales",
      postre: "Postres"
    };

    async function mostrarCarta() {
      const estado = document.querySelector("#estado");
      try {
        const respuesta = await fetch(api);
        if (!respuesta.ok) {
          throw new Error(`La API respondió ${respuesta.status}`);
        }

        const platos = await respuesta.json();
        const carta = document.querySelector("#carta");
        estado.textContent = `${respuesta.headers.get("X-Total") ?? platos.length} platos`;

        for (const categoria of categorias) {
          const grupo = platos.filter((plato) => plato.categoria === categoria);
          const seccion = document.createElement("section");
          const titulo = document.createElement("h2");
          const lista = document.createElement("ul");
          titulo.textContent = nombres[categoria];
          seccion.append(titulo, lista);

          for (const plato of grupo) {
            const fila = document.createElement("li");
            if (!plato.disponible) {
              fila.classList.add("no-disponible");
            }

            const nombre = document.createElement("span");
            nombre.textContent = `${plato.nombre}${plato.disponible ? "" : " · No disponible"}`;
            const precio = document.createElement("span");
            precio.className = "precio";
            precio.textContent = new Intl.NumberFormat("es-ES", {
              style: "currency",
              currency: "EUR"
            }).format(plato.precio);
            fila.append(nombre, precio);
            lista.append(fila);
          }

          carta.append(seccion);
        }
      } catch (error) {
        estado.textContent = "No se pudo cargar la carta. Comprueba que la API está disponible.";
        estado.classList.add("error");
        console.error(error);
      }
    }

    mostrarCarta();
  </script>
</body>
</html>
