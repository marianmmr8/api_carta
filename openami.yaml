openapi: 3.1.0
info:
  title: La carta de La Alacena
  version: 1.0.0
  description: API de platos con búsqueda, paginación y permisos de cocina y gerencia.
servers:
  - url: http://localhost/api_carta/api
paths:
  /platos:
    get:
      operationId: listarPlatos
      summary: Lista, filtra y pagina los platos
      parameters:
        - name: categoria
          in: query
          description: Filtra por categoría
          schema:
            $ref: "#/components/schemas/Categoria"
        - name: buscar
          in: query
          description: Busca este texto dentro del nombre
          schema:
            type: string
        - name: pagina
          in: query
          description: Número de página, desde 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: por_pagina
          in: query
          description: Platos por página (máximo 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Platos coincidentes; X-Total informa el total antes de paginar
          headers:
            X-Total:
              description: Número total de platos que coinciden con los filtros
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plato"
        "400":
          $ref: "#/components/responses/SolicitudIncorrecta"
    post:
      operationId: crearPlato
      summary: Crea un plato
      security:
        - claveCocina: []
        - claveGerencia: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatoNuevo"
      responses:
        "201":
          description: Plato creado
          headers:
            Location:
              description: Ruta del plato creado
              schema:
                type: string
                example: /api_carta/api/platos/10
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "400":
          $ref: "#/components/responses/SolicitudIncorrecta"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/DatosNoValidos"
  /platos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del plato
        schema:
          type: integer
          minimum: 1
    get:
      operationId: verPlato
      summary: Devuelve un plato
      responses:
        "200":
          description: Plato encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    put:
      operationId: sustituirPlato
      summary: Sustituye todos los campos de un plato
      security:
        - claveCocina: []
        - claveGerencia: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatoNuevo"
      responses:
        "200":
          description: Plato actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "400":
          $ref: "#/components/responses/SolicitudIncorrecta"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/DatosNoValidos"
    patch:
      operationId: actualizarPlatoParcial
      summary: Modifica solo los campos enviados
      security:
        - claveCocina: []
        - claveGerencia: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioPlato"
      responses:
        "200":
          description: Plato actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plato"
        "400":
          $ref: "#/components/responses/SolicitudIncorrecta"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/DatosNoValidos"
    delete:
      operationId: borrarPlato
      summary: Borra un plato (solo gerencia)
      security:
        - claveGerencia: []
      responses:
        "204":
          description: Plato borrado; respuesta sin cuerpo
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
components:
  securitySchemes:
    claveCocina:
      type: http
      scheme: bearer
      bearerFormat: Token de cocina
    claveGerencia:
      type: http
      scheme: bearer
      bearerFormat: Token de gerencia
  responses:
    SolicitudIncorrecta:
      description: Los parámetros o el cuerpo no son válidos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutorizado:
      description: Falta la clave de la API o no es válida
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    SinPermiso:
      description: La clave es válida, pero no tiene permiso para borrar
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NoEncontrado:
      description: No existe el recurso solicitado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflicto:
      description: Ya existe un plato con ese nombre
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    DatosNoValidos:
      description: Uno o varios datos no son válidos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Categoria:
      type: string
      enum: [entrante, principal, postre]
    Plato:
      type: object
      required: [id, nombre, categoria, precio, disponible]
      properties:
        id:
          type: integer
        nombre:
          type: string
        categoria:
          $ref: "#/components/schemas/Categoria"
        precio:
          type: number
        disponible:
          type: boolean
    PlatoNuevo:
      type: object
      required: [nombre, categoria, precio]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        categoria:
          $ref: "#/components/schemas/Categoria"
        precio:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 10000
        disponible:
          type: boolean
          default: true
      description: Los campos adicionales, como id, se ignoran.
    CambioPlato:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        categoria:
          $ref: "#/components/schemas/Categoria"
        precio:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 10000
        disponible:
          type: boolean
      description: Envía uno o varios campos; los demás no se modifican.
    Error:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errores:
          type: object
          additionalProperties:
            type: string
